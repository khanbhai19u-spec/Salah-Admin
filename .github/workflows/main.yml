name: Build Admin APK
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'index.html'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack bundle
        run: python3 "$(ls *bundle*.py | head -n 1)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p app
          cd app
          flutter create --platforms=android --org com.bgdph --project-name salahadmin .

      - name: Upgrade Android Gradle Plugin
        run: |
          sed -i -E 's/(com\.android\.application"\)? +version +")8\.1\.[0-3]"/\18.1.4"/' app/android/settings.gradle*
          grep -n "com.android.application" app/android/settings.gradle*

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD_RAW: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | tr -d " \r\n" | base64 -d > app/android/app/upload-keystore.jks
            A=$(printf "%s" "$KEY_ALIAS_RAW" | tr -d ' \r\n')
            K=$(printf "%s" "$KEY_PASSWORD_RAW" | tr -d ' \r\n')
            S=$(printf "%s" "$STORE_PASSWORD_RAW" | tr -d ' \r\n')
            if ! keytool -list -keystore app/android/app/upload-keystore.jks -storepass "$S" -alias "$A" > /dev/null 2>&1; then
              echo "ERROR: KEY_ALIAS বা STORE_PASSWORD Secret ভুল। Settings > Secrets এ আবার দাও।"
              exit 1
            fi
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$S" "$K" "$A" > app/android/key.properties
            echo "Signing key OK"
          else
            echo "WARNING: KEYSTORE_BASE64 নেই — debug key ব্যবহার হবে"
          fi

      - name: Patch Android + copy sources
        run: python3 tools/patch_android.py

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons || echo "icon step skipped"
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/salah-admin.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Salah Admin 1.0.${{ github.run_number }}
          make_latest: true
          files: app/build/app/outputs/flutter-apk/salah-admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: salah-admin-apk
          path: app/build/app/outputs/flutter-apk/salah-admin.apk
